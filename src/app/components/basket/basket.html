<button class="back-button" (click)="back()">← Return to Shopping</button>
<div class="basket-container">
  <h2>Your Basket</h2>
  <div *ngIf="basket.length === 0" class="empty">
    <p>Your basket is empty.</p>
  </div>

  <div *ngFor="let item of basket" class="basket-item">
    <img [src]="item.image_url" alt="{{ item.name }}" />

    <div class="basket-info">
      <h3>{{ item.name }}</h3>
      <p>£{{ item.price | number: '1.2-2' }}</p>

      <div class="quantity-controls">
        <button (click)="decreaseQuantity(item)">−</button>
        <span>{{ item.quantity }}</span>
        <button (click)="increaseQuantity(item)">+</button>
      </div>
    </div>

    <div class="basket-total">
      <p>£{{ item.price * item.quantity | number: '1.2-2' }}</p>
      <button class="remove" (click)="removeItem(item._id)">Remove</button>
    </div>
  </div>

  <div *ngIf="basket.length > 0" class="basket-summary">
    <h3>Total: £{{ total | number: '1.2-2' }}</h3>
    <button class="buy-now" (click)="buyNow()">Buy Now</button>
  </div>
</div>
